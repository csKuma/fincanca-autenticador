name: Build and Deploy API

on:
  push:
    branches: [main, development]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production  # nome do ambiente criado nas configurações

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup do Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Docker tag
        id: vars
        run: |
          if [[ "${{ github.ref_name }}" == "development" ]]; then
            echo "tag=dev" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Build e push da imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ghcr.io/cskuma/fincanca-autenticador:${{ steps.vars.outputs.tag }}

      - name: Enviar docker-compose.yml para o servidor
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: docker-compose.yml
          target: /home/ubuntu/fincanca-stack

      - name: Atualizar stack via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ vars.SERVER_SSH_KEY }}
          script: |
            docker pull ghcr.io/cskuma/fincanca-autenticador:${{ steps.vars.outputs.tag }}
            docker-compose -f /home/ubuntu/fincanca-stack/docker-compose.yml up -d
